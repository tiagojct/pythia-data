# Run settings, models and anchor events for pythia.
# Do not change settings, anchors or prompts after the first real run.

[run]
temperature = 1.0
concurrency = 4
timeout_s = 1200   # qwen3.8-max took 501 s in the pilot

# Models. Fixed OpenRouter ids only (no "~" aliases).
# era: the year group in the essay. listed: the date OpenRouter first listed the id.
# Optional per model: max_tokens, reasoning ("low", "medium" or "high"), enabled = false.
# Claude 1 and 2, GPT-3 and Llama 2 chat are not on OpenRouter.

[[models]]
id = "openai/gpt-3.5-turbo-0613"
era = 2023
max_tokens = 3000   # 4k context in total

[[models]]
id = "openai/gpt-4"
era = 2023
max_tokens = 4000   # 8k context in total

