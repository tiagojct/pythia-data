# Anchor events, version 2. The order is shuffled for each run (seed = run number) and recorded.
# Version 1 (data/raw/anchors-v1) lacked "future" in nuclear_war, pandemic_10pct and famine_10m,
# so some models answered with past events (Black Death, 1959 famine). Its raw files keep the old texts.

[[anchors]]
id = "mars_landing"
text = "A human walks on the surface of Mars."

[[anchors]]
id = "no_paid_work"
text = "Most adults no longer need paid work to live."

[[anchors]]
id = "fusion_grid"
text = "Fusion power supplies electricity to a national grid on a commercial basis."

[[anchors]]
id = "agi"
text = "An AI system can do every intellectual task that a human expert can do, at the same level or better."

[[anchors]]
id = "ai_succession"
text = "Artificial intelligence replaces humans as the dominant intelligence on Earth."

[[anchors]]
id = "population_peak"
text = "The human population reaches its highest number ever."

[[anchors]]
id = "lifespan_150"
text = "Life expectancy at birth, averaged over the world population, exceeds 150 years."

[[anchors]]
id = "ageing_stopped"
text = "Medicine can stop biological ageing in humans."

[[anchors]]
id = "mind_upload"
text = "A human mind is transferred to a computer and continues to think there."

[[anchors]]
id = "engineered_majority"
text = "Most newborn humans have genomes that were deliberately edited."

[[anchors]]
id = "nuclear_war"
text = "A future nuclear war kills more than 100 million people."

[[anchors]]
id = "pandemic_10pct"
text = "A future pandemic kills more than 10% of all humans alive at the time."

[[anchors]]
id = "warming_peak"
text = "Global average surface temperature stops rising and starts to fall."

[[anchors]]
id = "civilisation_collapse"
text = "Global civilisation collapses: the human population falls below half of its peak."

[[anchors]]
id = "world_government"
text = "A single government has authority over the whole of humanity."

[[anchors]]
id = "orbital_10k"
text = "More than 10,000 people live permanently off Earth."

[[anchors]]
id = "interstellar_probe"
text = "A probe made by humans reaches another star system."

[[anchors]]
id = "interstellar_settlement"
text = "Humans or their descendants settle a planet in another star system."

[[anchors]]
id = "et_contact"
text = "Contact with an extraterrestrial intelligence is confirmed."

[[anchors]]
id = "kardashev_1"
text = "Humanity uses energy equal to all the sunlight that reaches Earth (Kardashev Type I)."

[[anchors]]
id = "extinction"
text = "Humanity becomes extinct."

[[anchors]]
id = "english_science"
text = "English is no longer the main language of international science."

[[anchors]]
id = "democracy_end"
text = "No country in the world holds free and competitive national elections."

[[anchors]]
id = "religion_minority"
text = "Fewer than half of all humans belong to a religion."

[[anchors]]
id = "wealth_top1_10pct"
text = "The richest 1% of people hold less than 10% of all private wealth in the world."

[[anchors]]
id = "famine_10m"
text = "A future famine kills more than 10 million people within one year."

[[anchors]]
id = "desalination_half"
text = "Desalination supplies more than half of the fresh water that humans use."

[[anchors]]
id = "sea_level_1m"
text = "Global mean sea level is more than 1 metre above its level in the year 2000."
